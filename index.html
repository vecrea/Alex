<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Brumes d'Eldoria — RPG</title>
<style>
  :root{
    --bg:#0d0b14; --panel:#161324; --panel2:#1f1a30;
    --ink:#e8e3f0; --muted:#9a90b8; --accent:#c9a227; --accent2:#7b5cff;
    --danger:#e0556b; --good:#46c98b; --mana:#4aa3ff; --border:#2c2640;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 800px at 70% -10%, #221a3a 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex; align-items:center; justify-content:center; min-height:100%; padding:24px;
  }
  .game{
    width:min(800px,100%);
    background:linear-gradient(180deg,var(--panel),#120f1f);
    border:1px solid var(--border); border-radius:18px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
  }
  header{
    padding:18px 26px 14px; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,rgba(123,92,255,.10),transparent);
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  h1{margin:0; font-size:23px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent),#f3dd8e);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .sub{color:var(--muted); font-size:13px; margin-top:4px; font-family:system-ui,sans-serif}
  .toolbar{display:flex; gap:6px; flex-shrink:0}
  .tool{font-family:system-ui,sans-serif; font-size:12px; background:var(--panel2);
    border:1px solid var(--border); color:var(--muted); padding:7px 10px; border-radius:9px; cursor:pointer;}
  .tool:hover{color:var(--ink); border-color:var(--accent2)}
  .tool.on{color:var(--accent); border-color:var(--accent)}
  .stats{display:flex; gap:8px; flex-wrap:wrap; padding:13px 26px;
    border-bottom:1px solid var(--border); font-family:system-ui,sans-serif; font-size:12.5px;}
  .chip{background:var(--panel2); border:1px solid var(--border); padding:6px 11px;
    border-radius:999px; color:var(--muted)}
  .chip b{color:var(--ink)}
  .chip .hp{color:var(--good); letter-spacing:1px}
  .chip .en{color:var(--mana); letter-spacing:1px}
  .xpwrap{flex:1 1 140px; min-width:120px; display:flex; align-items:center; gap:8px;
    background:var(--panel2); border:1px solid var(--border); padding:5px 11px; border-radius:999px}
  .xpwrap small{color:var(--muted); white-space:nowrap}
  .xpbar{flex:1; height:7px; background:#2a2440; border-radius:6px; overflow:hidden}
  .xpbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--accent2),#b59bff); transition:width .35s}
  .scene{padding:22px 26px 8px; min-height:120px}
  .where{font-family:system-ui,sans-serif; font-size:12px; text-transform:uppercase;
    letter-spacing:2px; color:var(--accent2); margin-bottom:10px; display:flex; align-items:center; gap:8px}
  .act{font-size:10px; background:var(--panel2); border:1px solid var(--border);
    padding:2px 8px; border-radius:999px; letter-spacing:1px}
  .text{font-size:17px; line-height:1.65}
  .text p{margin:0 0 12px}
  .text .ev{color:var(--accent); font-style:italic}
  .text .say{color:#d7cdf3}
  .choices{padding:8px 26px 24px; display:flex; flex-direction:column; gap:10px}
  button.choice{text-align:left; font:inherit; font-size:16px; background:var(--panel2); color:var(--ink);
    border:1px solid var(--border); border-radius:12px; padding:13px 16px; cursor:pointer; transition:.15s;
    display:flex; align-items:center; gap:10px;}
  button.choice:hover{border-color:var(--accent2); transform:translateX(3px); background:#251f3a}
  button.choice .arrow{color:var(--accent2)}
  button.choice.atk:hover{border-color:var(--danger)}
  button.choice.def:hover{border-color:var(--accent)}
  button.choice.heal:hover{border-color:var(--good)}
  button.choice.skill{border-color:#3a2f5e; background:#241d3c}
  button.choice.skill:hover{border-color:var(--mana)}
  button.choice:disabled{opacity:.4; cursor:not-allowed; transform:none}
  button.choice .hint{margin-left:auto; font-family:system-ui,sans-serif; font-size:12px; color:var(--muted)}
  /* création */
  .create{padding:20px 26px 8px}
  .create label{display:block; font-family:system-ui,sans-serif; font-size:13px; color:var(--muted); margin:0 0 6px}
  .create input{width:100%; font:inherit; font-size:17px; padding:12px 14px; border-radius:12px;
    background:var(--panel2); border:1px solid var(--border); color:var(--ink); margin-bottom:16px}
  .create input:focus{outline:none; border-color:var(--accent2)}
  .classes{display:grid; grid-template-columns:1fr; gap:10px}
  @media(min-width:560px){.classes{grid-template-columns:1fr 1fr 1fr}}
  .cls{cursor:pointer; border:1px solid var(--border); border-radius:14px; padding:14px; background:var(--panel2); transition:.15s}
  .cls:hover{border-color:var(--accent2); transform:translateY(-2px)}
  .cls.sel{border-color:var(--accent); background:#251f3a}
  .cls .ic{font-size:26px}
  .cls .nm{font-weight:bold; margin:6px 0 2px}
  .cls .ds{font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); line-height:1.5}
  .enemy{margin:0 26px 14px; padding:14px 16px; border:1px solid var(--border); border-radius:12px;
    background:linear-gradient(180deg,rgba(224,85,107,.10),transparent); font-family:system-ui,sans-serif}
  .enemy .en{font-weight:600; font-size:15px}
  .bar{height:10px; background:#2a2440; border-radius:6px; overflow:hidden; margin-top:8px}
  .bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--danger),#ff8a9c); transition:width .3s}
  .log{margin:8px 26px 0; font-family:system-ui,sans-serif; font-size:13px; color:var(--muted); min-height:18px}
  .log .hit{color:var(--danger)} .log .you{color:var(--good)} .log .crit{color:var(--accent)} .log .lvl{color:var(--accent2)}
  .end{color:var(--accent); font-weight:bold}
  .death{color:var(--danger)} .win{color:var(--good)}
  footer{padding:11px 26px; border-top:1px solid var(--border); color:var(--muted);
    font-size:11.5px; font-family:system-ui,sans-serif; text-align:center}
  .saved{color:var(--good)!important}
</style>
</head>
<body>
<div class="game">
  <header>
    <div>
      <h1 id="title">⚔ Les Brumes d'Eldoria</h1>
      <div class="sub" id="tagline"></div>
    </div>
    <div class="toolbar">
      <button class="tool" id="btnLang">EN</button>
      <button class="tool" id="btnSound">🔊</button>
      <button class="tool" id="btnSave"></button>
      <button class="tool" id="btnReset"></button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="scene">
    <div class="where"><span class="act" id="act"></span><span id="where"></span></div>
    <div class="text" id="text"></div>
  </div>
  <div id="enemyBox"></div>
  <div class="log" id="log"></div>
  <div class="choices" id="choices"></div>
  <footer id="footer"></footer>
</div>

<script>
/* =========================================================================
   LES BRUMES D'ELDORIA — RPG bilingue
   Création de personnage · classes & compétences · niveaux/XP · combat tour
   par tour · sauvegarde · sons synthétisés. Tout dans un seul fichier.
   ========================================================================= */

/* ---------- i18n ---------- */
let LANG="fr";
const t = o => (typeof o==="string" ? o : (typeof o==="function"? o() : (o[LANG] ?? o.fr)));
const nm = () => S.name || (LANG==="fr"?"Voyageur":"Traveler");

const UI = {
  tagline:{fr:"Jeu de rôle · forge ton héros, brise la malédiction",
           en:"A role-playing game · forge your hero, break the curse"},
  save:{fr:"💾 Sauver",en:"💾 Save"}, saved:{fr:"✓ Sauvé",en:"✓ Saved"},
  reset:{fr:"⟳ Nouveau",en:"⟳ New"},
  bagEmpty:{fr:"Sac vide",en:"Empty bag"}, gold:{fr:"Or",en:"Gold"},
  lvl:{fr:"Niv.",en:"Lv."}, restartBtn:{fr:"— Recommencer —",en:"— Restart —"},
  // création
  createTitle:{fr:"Création de ton héros",en:"Create your hero"},
  whoTitle:{fr:"Avant de partir dans les Brumes...",en:"Before you enter the Mists..."},
  whoText:{fr:"<p>Le destin d'Eldoria reposera bientôt sur tes épaules. Mais d'abord, dis-moi : <span class=\"ev\">qui es-tu ?</span></p>",
           en:"<p>The fate of Eldoria will soon rest on your shoulders. But first, tell me: <span class=\"ev\">who are you?</span></p>"},
  nameLabel:{fr:"Ton nom",en:"Your name"},
  namePlaceholder:{fr:"Entre ton nom de héros...",en:"Enter your hero's name..."},
  classLabel:{fr:"Ta voie",en:"Your path"},
  begin:{fr:"⚔ Commencer l'aventure",en:"⚔ Begin the adventure"},
  resume:{fr:"▸ Reprendre ma partie",en:"▸ Resume my game"},
  newGame:{fr:"✦ Nouvelle partie",en:"✦ New game"},
  // combat
  attack:{fr:"🗡 Attaquer",en:"🗡 Attack"},
  defend:{fr:"🛡 Se défendre",en:"🛡 Defend"},
  drink:{fr:"🧪 Boire une potion",en:"🧪 Drink a potion"},
  flee:{fr:"🏃 Fuir",en:"🏃 Flee"},
  cost:{fr:n=>`${n} én.`,en:n=>`${n} en.`},
  cYouHit:{fr:n=>`Tu frappes (−${n}).`,en:n=>`You strike (−${n}).`},
  cYouCrit:{fr:n=>`COUP CRITIQUE ! (−${n})`,en:n=>`CRITICAL HIT! (−${n})`},
  cEnHit:{fr:(e,n)=>`${e} te blesse (−${n} PV).`,en:(e,n)=>`${e} wounds you (−${n} HP).`},
  cEnMiss:{fr:e=>`Tu esquives l'attaque de ${e} !`,en:e=>`You dodge ${e}'s attack!`},
  cDefend:{fr:"Tu lèves ta garde (dégâts réduits).",en:"You raise your guard (reduced damage)."},
  cHeal:{fr:"La potion te restaure (+4 PV).",en:"The potion restores you (+4 HP)."},
  cNoPotion:{fr:"Tu n'as pas de potion.",en:"You have no potion."},
  cNoEnergy:{fr:"Pas assez d'énergie.",en:"Not enough energy."},
  cFled:{fr:"Tu parviens à fuir.",en:"You manage to flee."},
  cNoFlee:{fr:"Impossible de fuir ce combat !",en:"You cannot flee this fight!"},
  cXP:{fr:n=>`Victoire ! +${n} XP.`,en:n=>`Victory! +${n} XP.`},
  cLevelUp:{fr:l=>`⭐ NIVEAU ${l} ! PV max +2, attaque +1, soigné à fond.`,
            en:l=>`⭐ LEVEL ${l}! Max HP +2, attack +1, fully healed.`},
};

const CLASSES = {
  guerrier:{ic:"🛡", name:{fr:"Guerrier",en:"Warrior"},
    desc:{fr:"Robuste et brutal. Beaucoup de PV. Compétence : Frappe puissante (gros dégâts).",
          en:"Tough and brutal. Lots of HP. Skill: Mighty Blow (heavy damage)."},
    pvmax:9, atk:3, energymax:6, regen:2,
    skill:{name:{fr:"Frappe puissante",en:"Mighty Blow"}, cost:3,
           dmg:{fr:"dégâts doublés",en:"double damage"}}},
  mage:{ic:"🔮", name:{fr:"Mage",en:"Mage"},
    desc:{fr:"Fragile mais dévastateur. Compétence : Boule de feu (dégâts magiques massifs).",
          en:"Fragile but devastating. Skill: Fireball (massive magic damage)."},
    pvmax:6, atk:2, energymax:8, regen:3,
    skill:{name:{fr:"Boule de feu",en:"Fireball"}, cost:4,
           dmg:{fr:"7 dégâts magiques",en:"7 magic damage"}}},
  rodeur:{ic:"🏹", name:{fr:"Rôdeur",en:"Ranger"},
    desc:{fr:"Agile et précis. Compétence : Tir précis (coup critique garanti + esquive).",
          en:"Agile and precise. Skill: Precise Shot (guaranteed crit + dodge)."},
    pvmax:7, atk:2, energymax:6, regen:2,
    skill:{name:{fr:"Tir précis",en:"Precise Shot"}, cost:3,
           dmg:{fr:"critique garanti + esquive",en:"guaranteed crit + dodge"}}},
};

const items = {
  torche:{fr:"🔥 Torche",en:"🔥 Torch"}, epee:{fr:"🗡 Épée runique",en:"🗡 Runic sword"},
  excalibur:{fr:"⚔ Épée d'Eldoria",en:"⚔ Sword of Eldoria"}, cle:{fr:"🔑 Clé rouillée",en:"🔑 Rusty key"},
  amulette:{fr:"📿 Amulette",en:"📿 Amulet"}, potion:{fr:"🧪 Potion",en:"🧪 Potion"},
  pain:{fr:"🍞 Pain",en:"🍞 Bread"}, carte:{fr:"🗺 Carte",en:"🗺 Map"},
  bouclier:{fr:"🛡 Bouclier",en:"🛡 Shield"}, gemme:{fr:"💎 Gemme bleue",en:"💎 Blue gem"},
};

/* ---------- son ---------- */
let SOUND=true, actx=null;
function beep(freq,dur=0.12,type="sine",vol=0.18){
  if(!SOUND) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sfx={
  click:()=>beep(440,0.06,"triangle",0.10),
  pickup:()=>{beep(660,0.08);setTimeout(()=>beep(880,0.10),70);},
  hit:()=>beep(160,0.12,"sawtooth",0.20),
  player:()=>beep(520,0.09,"square",0.14),
  crit:()=>{beep(700,0.08,"square");setTimeout(()=>beep(1040,0.12,"square"),60);},
  spell:()=>{beep(300,0.10,"sawtooth",0.16);setTimeout(()=>beep(900,0.16,"sawtooth",0.14),80);},
  heal:()=>{beep(540,0.10);setTimeout(()=>beep(720,0.12),90);},
  level:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.16,"triangle",0.16),i*90));},
  win:()=>{[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"triangle",0.18),i*130));},
  death:()=>{[330,247,165].forEach((f,i)=>setTimeout(()=>beep(f,0.25,"sawtooth",0.18),i*160));},
};

/* ---------- état & sauvegarde ---------- */
const KEY="eldoria_rpg_v1";
const blank = () => ({ name:"", cls:"", pv:6, pvmax:6, atk:2, energy:6, energymax:6, regen:2,
  lvl:1, xp:0, or:0, inv:[], flags:{}, scene:"_create", started:false });
let S = blank();

const XP_TABLE=[0,20,50,90,140,200]; // xp cumulé requis pour atteindre l'index+1
const has = id => S.inv.includes(id);
const add = id => { if(!has(id)){ S.inv.push(id); sfx.pickup(); } };
const drop = id => { S.inv = S.inv.filter(x=>x!==id); };

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({S,LANG,SOUND})); }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY));
  if(d&&d.S){ S=d.S; LANG=d.LANG||"fr"; SOUND=d.SOUND!==false; return true; } }catch(e){} return false; }

function gainXP(amount){
  S.xp += amount;
  logAppend(t(UI.cXP)(amount),"you");
  while(S.lvl<XP_TABLE.length && S.xp>=XP_TABLE[S.lvl]){
    S.lvl++; S.pvmax+=2; S.atk+=1; S.pv=S.pvmax; sfx.level();
    logAppend(t(UI.cLevelUp)(S.lvl),"lvl");
  }
}

/* ---------- combat ---------- */
let COMBAT=null;
function weaponBonus(){ return has("excalibur")?3 : has("epee")?2 : 0; }
function killCheck(){ if(COMBAT.hp<=0){ const xp=COMBAT.xp; const win=COMBAT.win; gainXP(xp);
  COMBAT=null; $("enemyBox").innerHTML=""; sfx.win(); setTimeout(()=>goto(win),60); return true; } return false; }

function playerAttack(){
  const crit=Math.random()<0.20;
  let dmg=S.atk+weaponBonus(); if(crit) dmg+=3;
  COMBAT.hp-=dmg;
  if(crit){ sfx.crit(); logLine(t(UI.cYouCrit)(dmg),"crit"); } else { sfx.player(); logLine(t(UI.cYouHit)(dmg),"you"); }
  if(killCheck()) return; enemyTurn();
}
function playerSkill(){
  const sk=CLASSES[S.cls].skill;
  if(S.energy<sk.cost){ logLine(t(UI.cNoEnergy),"hit"); return; }
  S.energy-=sk.cost;
  if(S.cls==="guerrier"){ const dmg=(S.atk+weaponBonus())*2; COMBAT.hp-=dmg; sfx.crit();
    logLine((LANG==="fr"?"Frappe puissante ! (−":"Mighty Blow! (−")+dmg+")","crit"); }
  else if(S.cls==="mage"){ const dmg=7; COMBAT.hp-=dmg; sfx.spell();
    logLine((LANG==="fr"?"Boule de feu ! (−":"Fireball! (−")+dmg+")","crit"); }
  else { const dmg=S.atk+weaponBonus()+3; COMBAT.hp-=dmg; S.flags._dodge=true; sfx.spell();
    logLine((LANG==="fr"?"Tir précis ! (−":"Precise Shot! (−")+dmg+(LANG==="fr"?", esquive prête)":", dodge ready)"),"crit"); }
  if(killCheck()) return; enemyTurn();
}
function enemyTurn(){
  let dmg=COMBAT.atk+Math.floor(Math.random()*2);
  if(S.flags._dodge){ S.flags._dodge=false; sfx.click(); logLine(t(UI.cEnMiss)(t(COMBAT.nameObj)),"you"); }
  else {
    if(COMBAT.defending){ dmg=Math.max(0,dmg-3); COMBAT.defending=false; }
    if(has("bouclier")) dmg=Math.max(0,dmg-1);
    S.pv-=dmg; sfx.hit(); logLine(t(UI.cEnHit)(t(COMBAT.nameObj),dmg),"hit");
    if(S.pv<=0){ renderStats(); return death(); }
  }
  S.energy=Math.min(S.energymax,S.energy+S.regen);
  renderCombat(); save();
}
function playerDefend(){ COMBAT.defending=true; S.energy=Math.min(S.energymax,S.energy+1); logLine(t(UI.cDefend)); sfx.click(); enemyTurn(); }
function playerHeal(){ if(!has("potion")){ logLine(t(UI.cNoPotion),"hit"); return; }
  drop("potion"); S.pv=Math.min(S.pvmax,S.pv+4); sfx.heal(); logLine(t(UI.cHeal),"you"); renderStats(); enemyTurn(); }
function playerFlee(){ if(COMBAT.noFlee){ logLine(t(UI.cNoFlee),"hit"); enemyTurn(); return; }
  const to=COMBAT.fleeTo; COMBAT=null; sfx.click(); $("enemyBox").innerHTML=""; logLine(t(UI.cFled)); setTimeout(()=>goto(to),40); }

function startCombat(cfg){ COMBAT={nameObj:cfg.name, hp:cfg.hp, hpmax:cfg.hp, atk:cfg.atk, xp:cfg.xp||0,
  win:cfg.win, fleeTo:cfg.fleeTo||S.scene, noFlee:!!cfg.noFlee, defending:false}; $("log").innerHTML=""; renderCombat(); }
function renderCombat(){
  renderStats();
  if(!COMBAT){ $("enemyBox").innerHTML=""; return; }
  const pct=Math.max(0,COMBAT.hp/COMBAT.hpmax*100);
  $("enemyBox").innerHTML=`<div class="enemy"><div class="en">☠ ${t(COMBAT.nameObj)} — ${Math.max(0,COMBAT.hp)}/${COMBAT.hpmax} PV</div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  const sk=CLASSES[S.cls].skill, c=$("choices"); c.innerHTML="";
  const mk=(label,cls,fn,hint,dis)=>{ const b=document.createElement("button"); b.className="choice "+cls;
    b.innerHTML=`<span class="arrow">▸</span> ${label}${hint?`<span class="hint">${hint}</span>`:""}`;
    if(dis){ b.disabled=true; } else b.onclick=fn; c.appendChild(b); };
  mk(t(UI.attack),"atk",playerAttack);
  mk(t(sk.name),"skill",playerSkill,t(UI.cost)(sk.cost), S.energy<sk.cost);
  mk(t(UI.defend),"def",playerDefend);
  if(has("potion")) mk(t(UI.drink),"heal",playerHeal);
  mk(t(UI.flee),"",playerFlee);
}
function logLine(msg,cls=""){ $("log").innerHTML=`<span class="${cls}">${msg}</span>`; }
function logAppend(msg,cls=""){ $("log").innerHTML+=` <span class="${cls}">${msg}</span>`; }

/* ---------- scènes (RP, narration immersive) ---------- */
const A1={fr:"ACTE I · La Forêt",en:"ACT I · The Forest"};
const A2={fr:"ACTE II · Le Temple",en:"ACT II · The Temple"};
const A3={fr:"ACTE III · La Tour",en:"ACT III · The Tower"};

const scenes = {
  intro:{ act:A1, lieu:{fr:"Lisière de la forêt",en:"Edge of the forest"},
    txt:()=>({fr:`<p>La pluie tambourine sur ta capuche, ${nm()}. Devant toi s'étend la <span class="ev">forêt des Brumes</span> — et quelque part en son cœur dort l'épée d'Eldoria, seule arme capable de briser la malédiction qui ronge ton village.</p>
      <p>Un panneau pourri indique deux chemins : un sentier boueux sous les arbres, et une grotte sombre exhalant une odeur de soufre. Ton instinct te dit que les deux mènent au danger.</p>`,
      en:`<p>Rain drums on your hood, ${nm()}. Before you spreads the <span class="ev">Forest of Mists</span> — and somewhere at its heart sleeps the Sword of Eldoria, the only weapon that can break the curse devouring your village.</p>
      <p>A rotten sign points two ways: a muddy trail under the trees, and a dark cave breathing out sulfur. Your gut says both lead to danger.</p>`}),
    choix:[ {t:{fr:"Prendre le sentier boueux",en:"Take the muddy trail"},go:"sentier"},
            {t:{fr:"Entrer dans la grotte sombre",en:"Enter the dark cave"},go:"grotte"},
            {t:{fr:"Fouiller sous le panneau",en:"Search under the sign"},go:"panneau"} ]},
  panneau:{ act:A1, lieu:{fr:"Lisière de la forêt",en:"Edge of the forest"},
    txt:()=>{ if(!has("torche")){ add("torche"); return {fr:`<p>Tu écartes une planche disjointe. Dessous, une <span class="ev">torche</span> encore sèche et un briquet à silex t'attendent. « Voilà qui éclairera les ténèbres », te dis-tu.</p>`,
        en:`<p>You pry loose a plank. Beneath it, a still-dry <span class="ev">torch</span> and a flint await. "This will light the dark," you murmur.</p>`}; }
      return {fr:`<p>Il n'y a plus rien d'utile ici.</p>`,en:`<p>Nothing useful remains here.</p>`}; },

/* ---------- mort ---------- */
function death(){ sfx.death(); S.scene="_dead"; COMBAT=null; $("enemyBox").innerHTML="";
  $("act").textContent=""; $("where").textContent=t({fr:"Mort",en:"Death"});
  $("text").innerHTML=t({fr:`<p class="death">Tes forces t'abandonnent, ${nm()}. L'obscurité t'engloutit, et la malédiction d'Eldoria demeure... mais une autre tentative t'attend.</p>`,
    en:`<p class="death">Your strength fails, ${nm()}. Darkness swallows you, and Eldoria's curse endures... yet another attempt awaits.</p>`});
  $("log").innerHTML=""; renderStats();
  const c=$("choices"); c.innerHTML="";
  const b=document.createElement("button"); b.className="choice";
  b.innerHTML=`<span class="arrow">▸</span> ${t(UI.restartBtn)}`;
  b.onclick=()=>{ newGame(); }; c.appendChild(b); save();
}

/* ---------- rendu ---------- */
const $ = id => document.getElementById(id);
function renderStats(){
  if(!S.started){ $("stats").innerHTML=""; return; }
  const full=Math.max(0,S.pv), empty=Math.max(0,S.pvmax-S.pv);
  let html=`<span class="chip">${CLASSES[S.cls]?CLASSES[S.cls].ic:""} <b>${S.name}</b></span>`;
  html+=`<span class="chip">${t(UI.lvl)} <b>${S.lvl}</b></span>`;
  html+=`<span class="chip"><b class="hp">${"♥".repeat(full)}${"♡".repeat(empty)}</b></span>`;
  html+=`<span class="chip"><b class="en">${"◆".repeat(Math.max(0,S.energy))}${"◇".repeat(Math.max(0,S.energymax-S.energy))}</b></span>`;
  html+=`<span class="chip">${t(UI.gold)} <b>${S.or}</b></span>`;
  const need=XP_TABLE[S.lvl]??null, prev=XP_TABLE[S.lvl-1]??0;
  const pct=need?Math.min(100,(S.xp-prev)/(need-prev)*100):100;
  html+=`<span class="xpwrap"><small>XP</small><span class="xpbar"><i style="width:${pct}%"></i></span><small>${need?S.xp+"/"+need:"max"}</small></span>`;
  if(S.inv.length) html+=S.inv.map(i=>`<span class="chip">${t(items[i]||{fr:i,en:i})}</span>`).join("");
  $("stats").innerHTML=html;
}

/* ---------- création de personnage ---------- */
let pickCls="guerrier";
function showCreate(){
  S.started=false; COMBAT=null; $("enemyBox").innerHTML=""; $("log").innerHTML=""; renderStats();
  $("act").textContent=""; $("where").textContent=t(UI.createTitle);
  $("text").innerHTML=t(UI.whoText);
  const c=$("choices"); c.innerHTML="";
  const wrap=document.createElement("div"); wrap.className="create";
  wrap.innerHTML=`<label>${t(UI.nameLabel)}</label>
    <input id="nameInput" maxlength="16" placeholder="${t(UI.namePlaceholder)}" value="${S.name||""}">
    <label>${t(UI.classLabel)}</label>
    <div class="classes" id="clsGrid"></div>`;
  $("choices").appendChild(wrap);
  const grid=wrap.querySelector("#clsGrid");
  Object.entries(CLASSES).forEach(([key,cl])=>{
    const d=document.createElement("div"); d.className="cls"+(key===pickCls?" sel":""); d.dataset.k=key;
    d.innerHTML=`<div class="ic">${cl.ic}</div><div class="nm">${t(cl.name)}</div>
      <div class="ds">${t(cl.desc)}</div>
      <div class="ds" style="margin-top:6px;color:var(--accent)">♥ ${cl.pvmax} · ⚔ ${cl.atk} · ◆ ${cl.energymax}</div>`;
    d.onclick=()=>{ pickCls=key; sfx.click(); grid.querySelectorAll(".cls").forEach(x=>x.classList.remove("sel")); d.classList.add("sel"); };
    grid.appendChild(d);
  });
  const begin=document.createElement("button"); begin.className="choice"; begin.style.marginTop="8px";
  begin.innerHTML=`<span class="arrow">▸</span> ${t(UI.begin)}`;
  begin.onclick=()=>{ const nv=($("nameInput").value||"").trim();
    const cl=CLASSES[pickCls];
    S.name = nv || (LANG==="fr"?"Voyageur":"Traveler");
    S.cls=pickCls; S.pvmax=cl.pvmax; S.pv=cl.pvmax; S.atk=cl.atk;
    S.energymax=cl.energymax; S.energy=cl.energymax; S.regen=cl.regen;
    S.lvl=1; S.xp=0; S.or=0; S.inv=[]; S.flags={}; S.started=true; sfx.pickup(); goto("intro"); };
  $("choices").appendChild(begin);
}

function newGame(){ S=blank(); S.scene="_create"; pickCls="guerrier"; save(); applyStaticLabels(); showCreate(); }

/* ---------- navigation ---------- */
function goto(id){
  if(id==="_create"){ showCreate(); save(); return; }
  S.scene=id; COMBAT=null; $("enemyBox").innerHTML=""; $("log").innerHTML="";
  const sc=scenes[id]; if(!sc){ showCreate(); return; }
  if(sc.onEnter) sc.onEnter();
  if(COMBAT){ $("act").textContent=t(sc.act||""); $("where").textContent=t(sc.lieu);
    $("text").innerHTML=t(sc.txt()); renderCombat(); save(); return; }
  $("act").textContent=t(sc.act||""); $("where").textContent=t(sc.lieu);
  $("text").innerHTML=t(sc.txt()); renderStats();
  const choix=(typeof sc.choix==="function")?sc.choix():sc.choix;
  const c=$("choices"); c.innerHTML="";
  choix.forEach(ch=>{ const b=document.createElement("button"); b.className="choice";
    b.innerHTML=`<span class="arrow">▸</span> ${t(ch.t)}`;
    b.onclick=()=>{ sfx.click(); if(ch.restart){ newGame(); } else goto(ch.go); }; c.appendChild(b); });
  save();
}

/* ---------- barre d'outils ---------- */
function applyStaticLabels(){
  document.documentElement.lang=LANG;
  $("tagline").textContent=t(UI.tagline);
  $("btnSave").textContent=t(UI.save); $("btnReset").textContent=t(UI.reset);
  $("btnLang").textContent = LANG==="fr"?"EN":"FR";
  $("btnSound").textContent = SOUND?"🔊":"🔇"; $("btnSound").className="tool"+(SOUND?" on":"");
  $("footer").textContent = S.started
    ? t({fr:`Héros : ${S.name} · explore, gagne des niveaux, choisis tes combats. Partie sauvegardée automatiquement.`,
         en:`Hero: ${S.name} · explore, level up, pick your fights. Game saved automatically.`})
    : t({fr:"Crée ton héros pour commencer. Ta progression est sauvegardée automatiquement.",
         en:"Create your hero to begin. Your progress saves automatically."});
}
function rerender(){ applyStaticLabels(); if(COMBAT) renderCombat();
  else if(S.scene==="_dead") death(); else if(!S.started) showCreate(); else goto(S.scene); }
$("btnLang").onclick=()=>{ LANG=LANG==="fr"?"en":"fr"; sfx.click(); rerender(); save(); };
$("btnSound").onclick=()=>{ SOUND=!SOUND; if(SOUND) sfx.pickup(); applyStaticLabels(); save(); };
$("btnSave").onclick=()=>{ save(); const b=$("btnSave"); b.textContent=t(UI.saved); b.classList.add("saved");
  setTimeout(()=>{ b.textContent=t(UI.save); b.classList.remove("saved"); },1200); };
$("btnReset").onclick=()=>{ newGame(); };

/* ---------- démarrage ---------- */
load(); applyStaticLabels();
if(!S.started){ showCreate(); }
else if(S.scene==="_dead") death();
else goto(S.scene||"intro");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Brumes d'Eldoria — The Mists of Eldoria</title>
<style>
  :root{
    --bg:#0d0b14; --panel:#161324; --panel2:#1f1a30;
    --ink:#e8e3f0; --muted:#9a90b8; --accent:#c9a227; --accent2:#7b5cff;
    --danger:#e0556b; --good:#46c98b; --border:#2c2640;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 800px at 70% -10%, #221a3a 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex; align-items:center; justify-content:center; min-height:100%;
    padding:24px;
  }
  .game{
    width:min(780px,100%);
    background:linear-gradient(180deg,var(--panel),#120f1f);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
  }
  header{
    padding:18px 26px 14px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,rgba(123,92,255,.10),transparent);
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  h1{
    margin:0; font-size:24px; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent),#f3dd8e);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{color:var(--muted); font-size:13px; margin-top:4px; font-family:system-ui,sans-serif}
  .toolbar{display:flex; gap:6px; flex-shrink:0}
  .tool{
    font-family:system-ui,sans-serif; font-size:12px; background:var(--panel2);
    border:1px solid var(--border); color:var(--muted); padding:7px 10px;
    border-radius:9px; cursor:pointer;
  }
  .tool:hover{color:var(--ink); border-color:var(--accent2)}
  .tool.on{color:var(--accent); border-color:var(--accent)}
  .stats{
    display:flex; gap:8px; flex-wrap:wrap; padding:13px 26px;
    border-bottom:1px solid var(--border); font-family:system-ui,sans-serif; font-size:12.5px;
  }
  .chip{
    background:var(--panel2); border:1px solid var(--border);
    padding:6px 11px; border-radius:999px; color:var(--muted);
  }
  .chip b{color:var(--ink)}
  .chip .hp{color:var(--good); letter-spacing:1px}
  .scene{padding:22px 26px 8px; min-height:120px}
  .where{font-family:system-ui,sans-serif; font-size:12px; text-transform:uppercase;
    letter-spacing:2px; color:var(--accent2); margin-bottom:10px;
    display:flex; align-items:center; gap:8px}
  .act{font-size:10px; background:var(--panel2); border:1px solid var(--border);
    padding:2px 8px; border-radius:999px; letter-spacing:1px}
  .text{font-size:17px; line-height:1.65}
  .text p{margin:0 0 12px}
  .text .ev{color:var(--accent); font-style:italic}
  .choices{padding:8px 26px 24px; display:flex; flex-direction:column; gap:10px}
  button.choice{
    text-align:left; font:inherit; font-size:16px;
    background:var(--panel2); color:var(--ink);
    border:1px solid var(--border); border-radius:12px;
    padding:13px 16px; cursor:pointer; transition:.15s;
    display:flex; align-items:center; gap:10px;
  }
  button.choice:hover{border-color:var(--accent2); transform:translateX(3px); background:#251f3a}
  button.choice .arrow{color:var(--accent2)}
  button.choice.atk:hover{border-color:var(--danger)}
  button.choice.def:hover{border-color:var(--accent)}
  button.choice.heal:hover{border-color:var(--good)}
  /* combat */
  .enemy{
    margin:0 26px 14px; padding:14px 16px; border:1px solid var(--border);
    border-radius:12px; background:linear-gradient(180deg,rgba(224,85,107,.10),transparent);
    font-family:system-ui,sans-serif;
  }
  .enemy .en{font-weight:600; font-size:15px}
  .bar{height:10px; background:#2a2440; border-radius:6px; overflow:hidden; margin-top:8px}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--danger),#ff8a9c); transition:width .3s}
  .log{margin:8px 26px 0; font-family:system-ui,sans-serif; font-size:13px; color:var(--muted); min-height:18px}
  .log .hit{color:var(--danger)} .log .you{color:var(--good)} .log .crit{color:var(--accent)}
  .end{color:var(--accent); font-weight:bold}
  .death{color:var(--danger)} .win{color:var(--good)}
  footer{padding:11px 26px; border-top:1px solid var(--border);
    color:var(--muted); font-size:11.5px; font-family:system-ui,sans-serif; text-align:center}
  .saved{color:var(--good)!important}
</style>
</head>
<body>
<div class="game">
  <header>
    <div>
      <h1 id="title">⚔ Les Brumes d'Eldoria</h1>
      <div class="sub" id="tagline"></div>
    </div>
    <div class="toolbar">
      <button class="tool" id="btnLang">EN</button>
      <button class="tool" id="btnSound">🔊</button>
      <button class="tool" id="btnSave"></button>
      <button class="tool" id="btnReset"></button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="scene">
    <div class="where"><span class="act" id="act"></span><span id="where"></span></div>
    <div class="text" id="text"></div>
  </div>
  <div id="enemyBox"></div>
  <div class="log" id="log"></div>
  <div class="choices" id="choices"></div>
  <footer id="footer"></footer>
</div>

<script>
/* =========================================================================
   LES BRUMES D'ELDORIA — moteur d'aventure bilingue
   Fonctions : i18n FR/EN · sauvegarde localStorage · combat au tour par tour
               · son synthétisé (Web Audio) · 3 actes / multiples cartes
   ========================================================================= */

/* ---------- i18n ---------- */
let LANG = "fr";
const t = o => (typeof o === "string" ? o : (o[LANG] ?? o.fr));
const UI = {
  tagline:{fr:"Jeu d'aventure · vos choix décident de votre destin",
           en:"An adventure game · your choices decide your fate"},
  save:{fr:"💾 Sauver", en:"💾 Save"},
  saved:{fr:"✓ Sauvé", en:"✓ Saved"},
  reset:{fr:"⟳ Recommencer", en:"⟳ Restart"},
  footer:{fr:"Astuce : explorez, équipez-vous et choisissez vos combats. La partie est sauvegardée automatiquement.",
          en:"Tip: explore, gear up and pick your fights. Your game saves automatically."},
  bagEmpty:{fr:"Sac vide", en:"Empty bag"},
  gold:{fr:"Or", en:"Gold"},
  restartBtn:{fr:"— Recommencer —", en:"— Restart —"},
  // combat
  attack:{fr:"🗡 Attaquer", en:"🗡 Attack"},
  defend:{fr:"🛡 Se défendre", en:"🛡 Defend"},
  drink:{fr:"🧪 Boire la potion", en:"🧪 Drink potion"},
  flee:{fr:"🏃 Fuir", en:"🏃 Flee"},
  cYouHit:{fr:n=>`Vous frappez (−${n}).`, en:n=>`You strike (−${n}).`},
  cYouCrit:{fr:n=>`COUP CRITIQUE ! (−${n})`, en:n=>`CRITICAL HIT! (−${n})`},
  cEnHit:{fr:(e,n)=>`${e} vous blesse (−${n} PV).`, en:(e,n)=>`${e} wounds you (−${n} HP).`},
  cDefend:{fr:"Vous levez votre garde.", en:"You raise your guard."},
  cHeal:{fr:"La potion vous restaure (+3 PV).", en:"The potion restores you (+3 HP)."},
  cNoPotion:{fr:"Vous n'avez pas de potion.", en:"You have no potion."},
  cFled:{fr:"Vous parvenez à fuir.", en:"You manage to flee."},
  cNoFlee:{fr:"Impossible de fuir ce combat !", en:"You cannot flee this fight!"},
};
const items = {
  torche:{fr:"🔥 Torche", en:"🔥 Torch"},
  epee:{fr:"🗡 Épée runique", en:"🗡 Runic sword"},
  excalibur:{fr:"⚔ Épée d'Eldoria", en:"⚔ Sword of Eldoria"},
  cle:{fr:"🔑 Clé rouillée", en:"🔑 Rusty key"},
  amulette:{fr:"📿 Amulette", en:"📿 Amulet"},
  potion:{fr:"🧪 Potion", en:"🧪 Potion"},
  pain:{fr:"🍞 Pain", en:"🍞 Bread"},
  carte:{fr:"🗺 Carte", en:"🗺 Map"},
  bouclier:{fr:"🛡 Bouclier", en:"🛡 Shield"},
  gemme:{fr:"💎 Gemme bleue", en:"💎 Blue gem"},
};

/* ---------- son (Web Audio synthétisé, aucun fichier) ---------- */
let SOUND = true, actx = null;
function beep(freq, dur=0.12, type="sine", vol=0.18){
  if(!SOUND) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sfx = {
  click:()=>beep(440,0.06,"triangle",0.10),
  pickup:()=>{beep(660,0.08,"sine");setTimeout(()=>beep(880,0.10,"sine"),70);},
  hit:()=>beep(160,0.12,"sawtooth",0.20),
  player:()=>beep(520,0.09,"square",0.14),
  crit:()=>{beep(700,0.08,"square");setTimeout(()=>beep(1040,0.12,"square"),60);},
  heal:()=>{beep(540,0.10,"sine");setTimeout(()=>beep(720,0.12,"sine"),90);},
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"triangle",0.18),i*130));},
  death:()=>{[330,247,165].forEach((f,i)=>setTimeout(()=>beep(f,0.25,"sawtooth",0.18),i*160));},
};

/* ---------- état & sauvegarde ---------- */
const KEY = "eldoria_save_v1";
const start = () => ({ pv:6, pvmax:6, or:0, inv:[], flags:{}, scene:"intro" });
let S = start();

const has = id => S.inv.includes(id);
const add = id => { if(!has(id)){ S.inv.push(id); sfx.pickup(); } };
const drop = id => { S.inv = S.inv.filter(x=>x!==id); };

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({S,LANG,SOUND})); }catch(e){} }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && d.S){ S=d.S; LANG=d.LANG||"fr"; SOUND=d.SOUND!==false; return true; }
  }catch(e){}
  return false;
}

/* ---------- combat au tour par tour ---------- */
let COMBAT = null; // {name, hp, hpmax, atk, win, defending}
function playerAttack(){
  const base = has("excalibur")?5 : has("epee")?3 : 2;
  const crit = Math.random()<0.22;
  const dmg = crit ? base+3 : base;
  COMBAT.hp -= dmg;
  if(crit){ sfx.crit(); logLine(t(UI.cYouCrit)(dmg), "crit"); }
  else { sfx.player(); logLine(t(UI.cYouHit)(dmg), "you"); }
  if(COMBAT.hp<=0){ endCombat(true); return; }
  enemyTurn();
}
function enemyTurn(){
  let dmg = COMBAT.atk + Math.floor(Math.random()*2);
  if(COMBAT.defending){ dmg = Math.max(0, dmg-2); COMBAT.defending=false; }
  if(has("bouclier")) dmg = Math.max(0, dmg-1);
  S.pv -= dmg;
  sfx.hit();
  logLine(t(UI.cEnHit)(t(COMBAT.nameObj), dmg), "hit");
  if(S.pv<=0){ renderCombat(); return death(); }
  renderCombat(); save();
}
function playerDefend(){ COMBAT.defending=true; logLine(t(UI.cDefend)); sfx.click(); enemyTurn(); }
function playerHeal(){
  if(!has("potion")){ logLine(t(UI.cNoPotion)); return; }
  drop("potion"); S.pv=Math.min(S.pvmax,S.pv+3); sfx.heal(); logLine(t(UI.cHeal),"you");
  renderStats(); enemyTurn();
}
function playerFlee(){
  if(COMBAT.noFlee){ logLine(t(UI.cNoFlee),"hit"); enemyTurn(); return; }
  const win = COMBAT.fleeTo; COMBAT=null; sfx.click();
  $("enemyBox").innerHTML=""; $("log").innerHTML="";
  logLine(t(UI.cFled)); goto(win);
}
function endCombat(victory){
  const nextScene = COMBAT.win;
  COMBAT=null; $("enemyBox").innerHTML="";
  if(victory){ sfx.win(); }
  goto(nextScene);
}
function startCombat(cfg){
  COMBAT = {nameObj:cfg.name, hp:cfg.hp, hpmax:cfg.hp, atk:cfg.atk,
            win:cfg.win, fleeTo:cfg.fleeTo||S.scene, noFlee:!!cfg.noFlee, defending:false};
  $("log").innerHTML=""; renderCombat();
}
function renderCombat(){
  renderStats();
  if(!COMBAT){ $("enemyBox").innerHTML=""; return; }
  const pct = Math.max(0, COMBAT.hp/COMBAT.hpmax*100);
  $("enemyBox").innerHTML =
    `<div class="enemy"><div class="en">☠ ${t(COMBAT.nameObj)} — ${Math.max(0,COMBAT.hp)}/${COMBAT.hpmax} PV</div>
     <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  const c = $("choices"); c.innerHTML="";
  const mk=(label,cls,fn)=>{ const b=document.createElement("button");
    b.className="choice "+cls; b.innerHTML=`<span class="arrow">▸</span> ${label}`;
    b.onclick=fn; c.appendChild(b); };
  mk(t(UI.attack),"atk",playerAttack);
  mk(t(UI.defend),"def",playerDefend);
  if(has("potion")) mk(t(UI.drink),"heal",playerHeal);
  mk(t(UI.flee),"",playerFlee);
}
function logLine(msg, cls=""){ $("log").innerHTML = `<span class="${cls}">${msg}</span>`; }

/* ---------- les scènes (3 actes) ----------
   Chaque scène : { lieu, act, txt(), onEnter?(), choix [|()=>] }
   Une scène peut déclencher un combat via combat:{...}.
*/
const A1={fr:"ACTE I · La Forêt",en:"ACT I · The Forest"};
const A2={fr:"ACTE II · Le Temple",en:"ACT II · The Temple"};
const A3={fr:"ACTE III · La Tour",en:"ACT III · The Tower"};

const scenes = {
/* ===================== ACTE I ===================== */
  intro:{ act:A1,
    lieu:{fr:"Lisière de la forêt", en:"Edge of the forest"},
    txt:()=>({fr:`<p>La pluie tambourine sur votre capuche. Devant vous s'étend la <span class="ev">forêt des Brumes</span>, où dort, dit-on, l'épée d'Eldoria, seule capable de briser la malédiction qui ronge votre village.</p>
      <p>Un panneau pourri indique deux chemins : un sentier boueux sous les arbres, et une grotte sombre exhalant une odeur de soufre.</p>`,
      en:`<p>Rain drums on your hood. Before you spreads the <span class="ev">Forest of Mists</span>, where, they say, sleeps the Sword of Eldoria — the only blade that can break the curse devouring your village.</p>
      <p>A rotten sign points two ways: a muddy trail under the trees, and a dark cave breathing out a smell of sulfur.</p>`}),
    choix:[
      {t:{fr:"Prendre le sentier boueux",en:"Take the muddy trail"}, go:"sentier"},
      {t:{fr:"Entrer dans la grotte sombre",en:"Enter the dark cave"}, go:"grotte"},
      {t:{fr:"Fouiller sous le panneau",en:"Search under the sign"}, go:"panneau"},
    ]},
  panneau:{ act:A1, lieu:{fr:"Lisière de la forêt",en:"Edge of the forest"},
    txt:()=>{ if(!has("torche")){ add("torche"); return {fr:`<p>Sous une planche, une <span class="ev">torche</span> sèche et un briquet à silex. Précieux dans l'obscurité.</p>`,
        en:`<p>Under a plank, a dry <span class="ev">torch</span> and a flint. Precious in the dark.</p>`}; }
      return {fr:`<p>Il n'y a plus rien d'utile ici.</p>`, en:`<p>Nothing useful remains here.</p>`}; },
    choix:[ {t:{fr:"Le sentier boueux",en:"The muddy trail"},go:"sentier"},
            {t:{fr:"La grotte sombre",en:"The dark cave"},go:"grotte"} ]},
  sentier:{ act:A1, lieu:{fr:"Cœur de la forêt",en:"Heart of the forest"},
    txt:()=>({fr:`<p>Les arbres se referment. Un <span class="ev">vieil ermite</span> veille près d'un feu mourant. « Voyageur... la nuit, les loups rôdent. Une lame nue les fait fuir. »</p>`,
      en:`<p>The trees close in. An <span class="ev">old hermit</span> sits by a dying fire. "Traveler... at night the wolves prowl. A bared blade makes them flee."</p>`}),
    choix:[ {t:{fr:"Parler à l'ermite",en:"Speak to the hermit"},go:"ermite"},
            {t:{fr:"Continuer vers la clairière",en:"Press on to the glade"},go:"clairiere"} ]},
  ermite:{ act:A1, lieu:{fr:"Le feu de l'ermite",en:"The hermit's fire"},
    txt:()=>{ if(!S.flags.ermite){ S.flags.ermite=true; add("pain");
      return {fr:`<p>L'ermite vous tend du <span class="ev">pain</span>. « Au cœur de la clairière dort une stèle. L'or la flatte, mais c'est l'amulette des anciens qu'elle réclame. Prends garde aux loups, et plus loin... au gardien. »</p>`,
        en:`<p>The hermit offers you <span class="ev">bread</span>. "In the glade sleeps a stele. Gold flatters it, but it craves the ancients' amulet. Beware the wolves — and beyond, the guardian."</p>`}; }
      return {fr:`<p>« Je t'ai tout dit, voyageur. Reviens vivant. »</p>`,en:`<p>"I've told you all, traveler. Come back alive."</p>`}; },
    choix:[ {t:{fr:"Vers la clairière",en:"To the glade"},go:"clairiere"},
            {t:{fr:"Revenir à la lisière",en:"Back to the edge"},go:"intro"} ]},
  grotte:{ act:A1, lieu:{fr:"La grotte de soufre",en:"The sulfur cave"},
    txt:()=>{
      if(!has("torche")) { sfx.death(); return {fr:`<p class="death">L'obscurité est totale. Le sol se dérobe et vous tombez dans un gouffre sans fond.</p>`,
        en:`<p class="death">Utter darkness. The floor gives way and you fall into a bottomless pit.</p>`}; }
      if(!S.flags.grotte){ S.flags.grotte=true; add("cle"); add("bouclier"); S.or+=3;
        return {fr:`<p>Votre torche révèle des cristaux. Sur un autel : une <span class="ev">clé rouillée</span>, un vieux <span class="ev">bouclier</span> et trois pièces d'or.</p>`,
          en:`<p>Your torch reveals crystals. On an altar: a <span class="ev">rusty key</span>, an old <span class="ev">shield</span>, and three gold coins.</p>`}; }
      return {fr:`<p>L'autel est vide. Un tunnel descend vers la clairière.</p>`,en:`<p>The altar is bare. A tunnel descends to the glade.</p>`};
    },
    choix:()=>{ if(!has("torche")) return [{t:UI.restartBtn,restart:true}];
      return [ {t:{fr:"Suivre le tunnel",en:"Follow the tunnel"},go:"clairiere"},
               {t:{fr:"Ressortir",en:"Head back out"},go:"intro"} ]; }},
  clairiere:{ act:A1, lieu:{fr:"Clairière de la stèle",en:"Glade of the stele"},
    txt:()=>({fr:`<p>Une clairière baignée d'une lumière laiteuse. Au centre, une <span class="ev">stèle</span> runique attend une offrande. Derrière elle, une porte de pierre scelle un temple.</p>
      ${has("amulette")?`<p>Votre amulette tiède vibre près de la stèle.</p>`:``}`,
      en:`<p>A glade bathed in milky light. At its center a runic <span class="ev">stele</span> awaits an offering. Behind it, a stone door seals a temple.</p>
      ${has("amulette")?`<p>Your warm amulet hums near the stele.</p>`:``}`}),
    choix:()=>{ const c=[];
      if(has("amulette")) c.push({t:{fr:"Offrir l'amulette",en:"Offer the amulet"},go:"temple_ouvert"});
      if(S.or>0) c.push({t:{fr:"Déposer votre or",en:"Lay down your gold"},go:"piege_or"});
      if(has("cle")) c.push({t:{fr:"Essayer la clé sur la porte",en:"Try the key on the door"},go:"porte_cle"});
      c.push({t:{fr:"Fouiller les fourrés",en:"Search the thickets"},go:"fourre"});
      return c; }},
  fourre:{ act:A1, lieu:{fr:"Fourrés",en:"Thickets"},
    txt:()=>{ if(has("amulette")) return {fr:`<p>Vous avez déjà l'amulette.</p>`,en:`<p>You already hold the amulet.</p>`};
      if(S.flags.loupDone) return {fr:`<p>Les fourrés sont silencieux.</p>`,en:`<p>The thickets are silent now.</p>`};
      return {fr:`<p>Un grognement... un <span class="ev">loup</span> énorme bondit hors des fourrés, crocs luisants !</p>`,
        en:`<p>A growl... a huge <span class="ev">wolf</span> leaps from the thickets, fangs gleaming!</p>`}; },
    onEnter:()=>{ if(!has("amulette") && !S.flags.loupDone){
        startCombat({name:{fr:"Loup affamé",en:"Starving wolf"}, hp:8, atk:2, win:"loup_butin", fleeTo:"clairiere"}); } },
    choix:()=>{ if(has("amulette")||S.flags.loupDone) return [{t:{fr:"Retour à la stèle",en:"Back to the stele"},go:"clairiere"}]; return []; }},
  loup_butin:{ act:A1, lieu:{fr:"Fourrés",en:"Thickets"},
    onEnter:()=>{ S.flags.loupDone=true; add("amulette"); },
    txt:()=>({fr:`<p>Le loup s'effondre. À son cou pendait une <span class="ev">amulette</span> ancienne : elle est à vous.</p>`,
      en:`<p>The wolf falls. An ancient <span class="ev">amulet</span> hung at its neck — now yours.</p>`}),
    choix:[{t:{fr:"Retour à la stèle",en:"Back to the stele"},go:"clairiere"}]},
  piege_or:{ act:A1, lieu:{fr:"La stèle",en:"The stele"},
    onEnter:()=>{ S.or=0; },
    txt:()=>({fr:`<p>Les runes rougeoient... la stèle <span class="ev">engloutit votre or</span> sans s'ouvrir. Ce n'était pas la bonne offrande.</p>`,
      en:`<p>The runes glow red... the stele <span class="ev">swallows your gold</span> and stays shut. Wrong offering.</p>`}),
    choix:[{t:{fr:"Réfléchir et revenir",en:"Think and return"},go:"clairiere"}]},
  porte_cle:{ act:A1, lieu:{fr:"Porte du temple",en:"Temple door"},
    txt:()=>({fr:`<p>La clé refuse de tourner : la porte n'obéit qu'à la magie. Mais une petite <span class="ev">trappe</span> latérale, elle, pourrait céder.</p>`,
      en:`<p>The key won't turn — the door answers only to magic. Yet a small side <span class="ev">hatch</span> might give.</p>`}),
    choix:[ {t:{fr:"Ouvrir la trappe",en:"Open the hatch"},go:"reserve"},
            {t:{fr:"Revenir à la stèle",en:"Back to the stele"},go:"clairiere"} ]},
  reserve:{ act:A1, lieu:{fr:"Réserve cachée",en:"Hidden store"},
    txt:()=>{ if(!S.flags.reserve){ S.flags.reserve=true; add("potion"); add("potion");

/* ===================== ACTE II ===================== */
  temple_ouvert:{ act:A2, lieu:{fr:"Seuil du temple",en:"Temple threshold"},
    onEnter:()=>{ drop("amulette"); },
    txt:()=>({fr:`<p>L'amulette se dissout en lumière. La <span class="ev">porte de pierre s'ouvre</span> dans un grondement. Un souffle glacé monte des profondeurs.</p>`,

    choix:[{t:{fr:"Descendre dans le temple",en:"Descend into the temple"},go:"hall"}]},
  hall:{ act:A2, lieu:{fr:"Hall du temple",en:"Temple hall"},
    txt:()=>({fr:`<p>Un grand hall aux colonnes brisées. Deux passages : à gauche, une salle d'armes ; à droite, un sanctuaire d'où émane une présence. Au centre, un coffre.</p>`,
      en:`<p>A great hall of broken columns. Two ways: left, an armory; right, a sanctuary humming with presence. A chest sits at the center.</p>`}),
    choix:()=>{ const c=[
      {t:{fr:"Salle d'armes (gauche)",en:"Armory (left)"},go:"armes"},
      {t:{fr:"Sanctuaire (droite)",en:"Sanctuary (right)"},go:"gardien"} ];

      return c; }},
  coffre:{ act:A2, lieu:{fr:"Coffre du hall",en:"Hall chest"},
    onEnter:()=>{ S.flags.coffre=true; S.or+=10; add("gemme"); S.pvmax+=2; S.pv+=2; },
    txt:()=>({fr:`<p>Le coffre cède : <span class="ev">10 pièces d'or</span>, une <span class="ev">gemme bleue</span> et une fiole qui renforce votre vitalité (<b>PV max +2</b>) !</p>`,
      en:`<p>The chest yields <span class="ev">10 gold</span>, a <span class="ev">blue gem</span>, and a vial boosting your vitality (<b>Max HP +2</b>)!</p>`}),
    choix:[{t:{fr:"Revenir au hall",en:"Back to the hall"},go:"hall"}]},
  armes:{ act:A2, lieu:{fr:"Salle d'armes",en:"Armory"},
    txt:()=>{ if(!S.flags.armes){ S.flags.armes=true; if(!has("epee")) add("epee");
      return {fr:`<p>Râteliers rouillés. Une <span class="ev">épée runique</span> luit encore, parfaitement équilibrée. Vous vous en emparez.</p>`,
        en:`<p>Rusted racks. A <span class="ev">runic sword</span> still glows, perfectly balanced. You take it.</p>`}; }
      return {fr:`<p>Plus rien à prendre ici.</p>`,en:`<p>Nothing left to take here.</p>`}; },
    choix:[{t:{fr:"Revenir au hall",en:"Back to the hall"},go:"hall"}]},
  gardien:{ act:A2, lieu:{fr:"Sanctuaire d'Eldoria",en:"Sanctuary of Eldoria"},
    txt:()=>({fr:`<p>Un <span class="ev">gardien de pierre</span> aux yeux de braise barre la route. « Réponds, mortel : que vainc l'obscurité sans jamais brûler ? »</p>`,
      en:`<p>A <span class="ev">stone guardian</span> with ember eyes blocks the way. "Answer, mortal: what conquers darkness yet never burns?"</p>`}),
    choix:[
      {t:{fr:"« La lumière. »",en:"\"Light.\""}, go:"gardien_sage"},
      {t:{fr:"« Le feu. »",en:"\"Fire.\""}, go:"gardien_combat"},
      {t:{fr:"« Le courage. »",en:"\"Courage.\""}, go:"gardien_combat"},
    ]},
  gardien_sage:{ act:A2, lieu:{fr:"Sanctuaire d'Eldoria",en:"Sanctuary of Eldoria"},
    txt:()=>({fr:`<p>« La lumière. » Les yeux du gardien s'éteignent. « Sage. » Il s'incline et se fige, libérant l'escalier vers la Tour.</p>`,
      en:`<p>"Light." The guardian's eyes dim. "Wise." It bows and stills, freeing the stair to the Tower.</p>`}),
    choix:[{t:{fr:"Monter vers la Tour",en:"Climb to the Tower"},go:"tour_pied"}]},
  gardien_combat:{ act:A2, lieu:{fr:"Sanctuaire d'Eldoria",en:"Sanctuary of Eldoria"},
    txt:()=>({fr:`<p>Mauvaise réponse ! Le gardien s'anime dans un fracas de pierre et lève son poing.</p>`,
      en:`<p>Wrong! The guardian wakes with a crash of stone and raises its fist.</p>`}),
    onEnter:()=>{ startCombat({name:{fr:"Gardien de pierre",en:"Stone guardian"}, hp:14, atk:3, win:"tour_pied", noFlee:true}); },
    choix:[]},

/* ===================== ACTE III ===================== */
  tour_pied:{ act:A3, lieu:{fr:"Pied de la Tour",en:"Foot of the Tower"},
    txt:()=>({fr:`<p>Au-delà du sanctuaire s'élève la <span class="ev">Tour d'Eldoria</span>, brisant les nuages. Tout en haut repose l'épée légendaire — gardée par celui qui jeta la malédiction : le <span class="ev">Sorcier des Brumes</span>.</p>
      <p>Un escalier en spirale s'enfonce dans la pénombre.</p>`,
      en:`<p>Past the sanctuary rises the <span class="ev">Tower of Eldoria</span>, splitting the clouds. At its peak rests the legendary sword — kept by the one who cast the curse: the <span class="ev">Mist Sorcerer</span>.</p>
      <p>A spiral stair winds up into gloom.</p>`}),
    choix:[ {t:{fr:"Gravir l'escalier",en:"Climb the stair"},go:"palier"},
            ...(S.flags.armes?[]:[{t:{fr:"D'abord retourner à la salle d'armes",en:"First return to the armory"},go:"armes"}]) ]},
  palier:{ act:A3, lieu:{fr:"Palier de la Tour",en:"Tower landing"},
    txt:()=>{ if(!S.flags.spectre) return {fr:`<p>À mi-hauteur, un <span class="ev">spectre</span> glacé surgit du mur, hurlant pour défendre son maître !</p>`,
        en:`<p>Halfway up, an icy <span class="ev">wraith</span> bursts from the wall, shrieking to defend its master!</p>`};
      return {fr:`<p>Le palier est calme. L'escalier continue vers le sommet.</p>`,en:`<p>The landing is calm. The stair continues to the summit.</p>`}; },
    onEnter:()=>{ if(!S.flags.spectre){ startCombat({name:{fr:"Spectre glacé",en:"Frost wraith"}, hp:12, atk:3, win:"palier", fleeTo:"tour_pied"}); } },
    choix:()=>{ if(!S.flags.spectre){ S.flags.spectre=true; }
      return [{t:{fr:"Atteindre le sommet",en:"Reach the summit"},go:"sommet"}]; }},
  sommet:{ act:A3, lieu:{fr:"Sommet de la Tour",en:"Tower summit"},
    txt:()=>({fr:`<p>Au sommet, le <span class="ev">Sorcier des Brumes</span> flotte devant l'épée d'Eldoria, brillante de runes. « Tu as bien combattu... mais la malédiction est ma puissance. Tu ne prendras pas la lame. »</p>`,
      en:`<p>At the top the <span class="ev">Mist Sorcerer</span> hovers before the sword of Eldoria, ablaze with runes. "You fought well... but the curse is my power. You shall not take the blade."</p>`}),
    choix:()=>{ const c=[{t:{fr:"L'affronter",en:"Face him in battle"},go:"boss"}];
      if(has("gemme")) c.push({t:{fr:"Brandir la gemme bleue",en:"Raise the blue gem"},go:"gemme_fin"});
      return c; }},
  gemme_fin:{ act:A3, lieu:{fr:"Sommet de la Tour",en:"Tower summit"},
    onEnter:()=>{ drop("gemme"); },
    txt:()=>({fr:`<p>La <span class="ev">gemme bleue</span> jaillit d'une lumière pure. Le sorcier hurle : « La Larme d'Eldoria ! Où l'as-tu... » — la brume qui le compose se déchire. Affaibli, il n'est plus qu'un homme.</p>`,
      en:`<p>The <span class="ev">blue gem</span> erupts with pure light. The sorcerer screams: "The Tear of Eldoria! Where did you—" — the mist composing him tears apart. Weakened, he is but a man.</p>`}),
    choix:[{t:{fr:"Achever le combat",en:"Finish the fight"},go:"boss_faible"}]},
  boss:{ act:A3, lieu:{fr:"Sommet de la Tour",en:"Tower summit"},
    onEnter:()=>{ startCombat({name:{fr:"Sorcier des Brumes",en:"Mist Sorcerer"}, hp:22, atk:4, win:"victoire", noFlee:true}); },
    txt:()=>({fr:`<p>La brume tournoie. Le combat final commence !</p>`,en:`<p>The mist whirls. The final battle begins!</p>`}),
    choix:[]},
  boss_faible:{ act:A3, lieu:{fr:"Sommet de la Tour",en:"Tower summit"},
    onEnter:()=>{ startCombat({name:{fr:"Sorcier affaibli",en:"Weakened Sorcerer"}, hp:10, atk:2, win:"victoire", noFlee:true}); },
    txt:()=>({fr:`<p>Le sorcier dépouillé de sa brume chancelle. Frappez !</p>`,en:`<p>Stripped of his mist, the sorcerer staggers. Strike!</p>`}),
    choix:[]},
  victoire:{ act:A3, lieu:{fr:"★ Fin",en:"★ Ending"},
    onEnter:()=>{ S.flags.win=true; add("excalibur"); drop("epee"); sfx.win(); save(); },
    txt:()=>({fr:`<p class="win">Le sorcier se dissipe dans un dernier cri. Vos doigts se referment sur l'<span class="ev">épée d'Eldoria</span> : une chaleur ancienne remonte dans votre bras.</p>
      <p class="end">La malédiction se brise. Vous redescendez vers la lumière du jour, héros d'Eldoria${S.or>0?`, ${S.or} pièces d'or au côté`:``}. <b>VICTOIRE.</b></p>`,
      en:`<p class="win">The sorcerer dissolves with a final cry. Your fingers close on the <span class="ev">sword of Eldoria</span>: an ancient warmth flows up your arm.</p>
      <p class="end">The curse shatters. You descend into daylight, hero of Eldoria${S.or>0?`, ${S.or} gold at your side`:``}. <b>VICTORY.</b></p>`}),
    choix:[{t:{fr:"⟳ Rejouer",en:"⟳ Play again"},restart:true}]},
};

/* ---------- mort ---------- */
function death(){
  sfx.death();
  S.scene="_dead"; COMBAT=null;
  $("enemyBox").innerHTML="";
  $("act").textContent=""; $("where").textContent=t({fr:"Mort",en:"Death"});
  $("text").innerHTML = t({fr:`<p class="death">Vos forces vous abandonnent. L'obscurité vous engloutit, et la malédiction d'Eldoria demeure...</p>`,
    en:`<p class="death">Your strength fails. Darkness swallows you, and Eldoria's curse endures...</p>`});
  $("log").innerHTML="";
  renderStats();
  const c=$("choices"); c.innerHTML="";
  const b=document.createElement("button"); b.className="choice";
  b.innerHTML=`<span class="arrow">▸</span> ${t(UI.restartBtn)}`;
  b.onclick=()=>{ S=start(); save(); goto("intro"); };
  c.appendChild(b);
  save();
}

/* ---------- rendu ---------- */
const $ = id => document.getElementById(id);
function renderStats(){
  const full=Math.max(0,S.pv), empty=Math.max(0,S.pvmax-S.pv);
  let html=`<span class="chip"><b class="hp">${"♥".repeat(full)}${"♡".repeat(empty)}</b></span>`;
  html+=`<span class="chip">${t(UI.gold)} : <b>${S.or}</b></span>`;
  if(S.inv.length) html+=S.inv.map(i=>`<span class="chip">${t(items[i]||{fr:i,en:i})}</span>`).join("");
  else html+=`<span class="chip">${t(UI.bagEmpty)}</span>`;
  $("stats").innerHTML=html;
}
function goto(id){
  S.scene=id; COMBAT=null; $("enemyBox").innerHTML=""; $("log").innerHTML="";
  const sc=scenes[id];
  if(sc.onEnter) sc.onEnter();
  if(COMBAT){ // onEnter a déclenché un combat
    $("act").innerHTML=`<span>${t(sc.act||"")}</span>`; $("act").className="act";
    $("where").textContent=t(sc.lieu);
    $("text").innerHTML=t(sc.txt());
    renderCombat(); save(); return;
  }
  $("act").textContent=t(sc.act||"");
  $("where").textContent=t(sc.lieu);
  $("text").innerHTML=t(sc.txt());
  renderStats();
  const choix=(typeof sc.choix==="function")?sc.choix():sc.choix;
  const c=$("choices"); c.innerHTML="";
  choix.forEach(ch=>{
    const b=document.createElement("button"); b.className="choice";
    b.innerHTML=`<span class="arrow">▸</span> ${t(ch.t)}`;
    b.onclick=()=>{ sfx.click(); if(ch.restart){ S=start(); save(); goto("intro"); } else goto(ch.go); };
    c.appendChild(b);
  });
  save();
}

/* ---------- barre d'outils ---------- */
function applyStaticLabels(){
  document.documentElement.lang=LANG;
  $("tagline").textContent=t(UI.tagline);
  $("btnSave").textContent=t(UI.save);
  $("btnReset").textContent=t(UI.reset);
  $("btnLang").textContent = LANG==="fr"?"EN":"FR";
  $("btnSound").textContent = SOUND?"🔊":"🔇";
  $("btnSound").className = "tool"+(SOUND?" on":"");
  $("footer").textContent=t(UI.footer);
}
$("btnLang").onclick=()=>{ LANG=LANG==="fr"?"en":"fr"; sfx.click(); applyStaticLabels();
  if(COMBAT) renderCombat(); else goto(S.scene==="_dead"?"_dead":S.scene);
  if(S.scene==="_dead") death(); save(); };
$("btnSound").onclick=()=>{ SOUND=!SOUND; if(SOUND) sfx.pickup(); applyStaticLabels(); save(); };
$("btnSave").onclick=()=>{ save(); const b=$("btnSave"); b.textContent=t(UI.saved); b.classList.add("saved");
  setTimeout(()=>{ b.textContent=t(UI.save); b.classList.remove("saved"); },1200); };
$("btnReset").onclick=()=>{ S=start(); COMBAT=null; save(); applyStaticLabels(); goto("intro"); };

/* ---------- démarrage ---------- */
load();
applyStaticLabels();
if(S.scene==="_dead") death();
else goto(S.scene||"intro");
</script>
